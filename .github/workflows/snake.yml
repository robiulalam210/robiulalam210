# .github/workflows/snake.yml
#
# এই workflow টি আপনার contribution graph কে একটি animated snake game এ
# রূপান্তর করে। Snake টি সবুজ contribution square গুলো খেয়ে ফেলে।
#
# তৈরি হওয়া SVG ফাইল "output" নামের একটি আলাদা branch এ save হয়,
# তাই আপনার main branch পরিষ্কার থাকে।

name: Generate Contribution Snake

on:
  schedule:
    # প্রতি ১২ ঘণ্টা পরপর snake আপডেট হবে
    - cron: "0 */12 * * *"
  # Actions ট্যাব থেকে হাতে চালানোর জন্য
  workflow_dispatch:
  push:
    branches: ["main"]

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Generate snake animation
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: robiulalam210
          outputs: |
            dist/github-snake.svg
            dist/github-snake-dark.svg?palette=github-dark
            dist/ocean.gif?color_snake=orange&color_dots=#bfd6f6,#8dbdff,#64a1f4,#4b91f1,#3c7dd9

      - name: Push to output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
